function tarjetaDe(v,r){
  const ts=tarjetas();if(!ts.length||!r||!r.monto)return null;const n=norm(v);
  if(!/\btarjeta\b|\bvisa\b|\bmastercard\b/.test(n))return null;
  const esCompra=/\bcon\s+(la\s+)?tarjeta\b/.test(n);const esPago=/\b(pague|abone|pago)\b.*\btarjeta\b/.test(n);
  if(!esCompra&&!esPago)return null;
  return ts.find(t=>n.includes(norm(t.texto).split(" ")[0]))||ts[0];
}
let override=null;
function updPreview(){
  const v=$("#cap").value.trim();const p=$("#preview");
  if(!v){p.hidden=true;$("#capHint").hidden=false;override=null;return}
  const r=parse(v);const sel=override||(r.tipo==="mov"?r.clase:r.tipo);
  let det=[];
  const tjp=sel==="gasto"?tarjetaDe(v,r):null;
  if(tjp){det.push(fmt(r.monto));det.push(/\bcon\s+(la\s+)?tarjeta\b/.test(norm(v))?`compra con ${tjp.texto}: sube la deuda, no sale de caja`:`pago de ${tjp.texto}: baja la deuda`)}
  else if(sel==="gasto"||sel==="ingreso"){det.push(r.monto?fmt(r.monto):"falta el monto");if(r.monto)det.push(r.clase===sel?r.categoria:catFor(norm(v),sel));if(r.fecha&&r.fecha!==today())det.push(niceDate(r.fecha))}
  else if(sel==="pago"){det.push(r.monto?fmt(r.monto):"falta el monto");det.push(r.fecha?"vence "+niceDate(r.fecha).toLowerCase():"sin fecha");if(r.repetir!=="no")det.push("↻ "+REP[r.repetir].toLowerCase());det.push("no descuenta de caja")}
  else{if(r.fecha)det.push(niceDate(r.fecha));if(r.hora)det.push(r.hora);if(r.repetir!=="no")det.push("↻ "+REP[r.repetir].toLowerCase());if(r.prioridad==="alta")det.push("importante")}
  p.innerHTML=`<span>Se guarda como</span>${Object.keys(OPC).map(k=>`<button type="button" class="tchip" data-tipo="${k}" aria-pressed="${k===sel}">${OPC[k]}</button>`).join("")}${det.length?`<span>· ${esc(det.join(" · "))}</span>`:""}`;
  p.hidden=false;$("#capHint").hidden=true;
}
$("#cap").addEventListener("input",updPreview);
$("#preview").addEventListener("click",e=>{const b=e.target.closest("[data-tipo]");if(!b)return;override=b.dataset.tipo;updPreview();$("#cap").focus()});
$("#capForm").addEventListener("submit",e=>{
  e.preventDefault();const v=$("#cap").value.trim();if(!v)return;
  const r=parse(v);const sel=override||(r.tipo==="mov"?r.clase:r.tipo);
  const tj=tarjetaDe(v,r);
  if(tj&&(sel==="gasto")&&r.monto){
    $("#cap").value="";override=null;updPreview();const n=norm(v);
    if(/\bcon\s+(la\s+)?tarjeta\b/.test(n)){const cons=(tj.consumos||[]).concat([{id:uid(),fecha:r.fecha||today(),monto:r.monto,texto:(r.texto.replace(/\s*con\s+(la\s+)?tarjeta\s*/i," ").trim()||"Compra").replace(/^./,x=>x.toUpperCase()),categoria:catFor(n,"gasto")}]);saveItem({...tj,consumos:cons});toast(`Compra con ${tj.texto}: ${fmt(r.monto)}. Deuda: ${fmt(deudaTarjeta({...tj,consumos:cons}))}`);return}
    const antes=deudaTarjeta(tj);saveItem({id:uid(),tipo:"mov",clase:"gasto",monto:r.monto,texto:`Pago ${tj.texto}`,categoria:"Cuotas y deudas",fecha:r.fecha||today(),creado:Date.now(),tarjetaId:tj.id});toast(`Pago de ${tj.texto}: ${fmt(r.monto)}. Ahora debés ${fmt(antes-r.monto)}`);return;
  }
  if(sel==="gasto"||sel==="ingreso"){
    $("#cap").value="";override=null;updPreview();
    if(!r.monto){openMoney(null,{clase:sel,texto:r.texto});return}
    const m={id:uid(),tipo:"mov",clase:sel,monto:r.monto,categoria:r.clase===sel?r.categoria:catFor(norm(v),sel),texto:r.texto,fecha:r.fecha||today(),creado:Date.now()};
    saveItem(m);toast(`${sel==="gasto"?"Gasto":"Ingreso"} guardado: ${fmt(m.monto)} · ${m.categoria}`);return;
  }
  if(sel==="pago"){
    $("#cap").value="";override=null;updPreview();
    if(!r.monto){openPago(null,{texto:r.texto,fecha:r.fecha});return}
    const p={id:uid(),tipo:"pago",texto:r.texto,monto:r.monto,fecha:r.fecha,hora:null,categoria:r.categoria||catFor(norm(v),"gasto"),repetir:r.repetir,prioridad:"normal",estado:"pendiente",creado:Date.now()};
    saveItem(p);toast(`Por pagar: ${fmt(p.monto)}${p.fecha?", vence "+niceDate(p.fecha).toLowerCase():""}. No se descontó de caja.`);return;
  }
  const tipo=sel;
  const it={id:uid(),tipo,texto:r.texto,fecha:r.fecha,hora:r.hora,repetir:r.repetir,prioridad:r.prioridad,estado:"pendiente",creado:Date.now(),detalle:""};
  if(tipo==="evento"&&!it.fecha)it.fecha=today();
  if(tipo==="fecha"&&it.repetir==="no")it.repetir="anual";
  saveItem(it);$("#cap").value="";override=null;updPreview();
  toast(`${TIPOS[tipo]} guardad${tipo==="tarea"||tipo==="nota"||tipo==="fecha"?"a":"o"}${it.fecha?" para "+niceDate(it.fecha).toLowerCase():""}`);
});

/* ---------- acciones ---------- */
document.addEventListener("click",async e=>{
  const nb=e.target.closest("nav.tabs button");if(nb){go(nb.dataset.tab);return}
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act;const it=items.find(i=>i.id===b.dataset.id);const t=today();
  if((a==="pagar"||a==="toggle")&&it&&it.tipo==="pago"&&it.estado!=="hecho"){openPagar(it);return}
  if(a==="toggle"&&it){
    if(it.estado!=="hecho"&&it.repetir&&it.repetir!=="no"&&it.fecha){
      const next={...it,fecha:addInterval(eff(it)||it.fecha,it.repetir),top3:null};saveItem(next);toast(`Listo. Próxima vez: ${niceDate(next.fecha).toLowerCase()}`);
    }else{const done=it.estado!=="hecho";saveItem({...it,estado:done?"hecho":"pendiente",hechoEl:done?t:null});if(done)toast("¡Hecho!")}
  }
  else if(a==="star"&&it){
    const on=it.top3===t;const n=items.filter(i=>i.top3===t&&i.estado!=="hecho").length;
    if(!on&&n>=3){toast("Ya tenés 3 prioridades. Quitá una primero.");return}
    saveItem({...it,top3:on?null:t});
  }
  else if(a==="hoy"&&it)saveItem({...it,fecha:t});
  else if(a==="manana"&&it)saveItem({...it,fecha:addDays(t,1)});
  else if(a==="edit"&&it)openSheet(it);
  else if(a==="filtro"){tareasFiltro=b.dataset.f;render()}
  else if(a==="mesPrev"){finMes=ymAdd(finMes,-1);render("l")}
  else if(a==="mesNext"){finMes=ymAdd(finMes,1);render("r")}
  else if(a==="nuevoIngreso")openMoney(null,{clase:"ingreso"});
  else if(a==="nuevoGasto")openMoney(null,{clase:"gasto"});
  else if(a==="nuevoPago")openPago(null);
  else if(a==="nuevaCompra")openCompra(null);
  else if(a==="dinSeg"){const o=["resumen","plan","movs","precios"];const d=o.indexOf(b.dataset.s)>o.indexOf(dinSeg)?"r":"l";dinSeg=b.dataset.s;render(d)}
  else if(a==="copiarResumen"){try{await navigator.clipboard.writeText(resumenTxt);toast("Resumen copiado")}catch{toast("No se pudo copiar en este dispositivo")}}
  else if(a==="cfgSueldo")openSueldo();
  else if(a==="nuevoFijo")openFijo(null);
  else if(a==="pagarFijo"&&it)openPagarFijo(it,b.dataset.ym);
  else if(a==="saltarFijo"&&it){saveItem({...it,saltar:[...(it.saltar||[]),b.dataset.ym]});toast("Marcado como pagado. No se descontó de caja.")}
  else if(a==="cobrar")openCobro(b.dataset.key);
  else if(a==="saltarCobro"){ajustes.cobrosSaltados=[...(ajustes.cobrosSaltados||[]),b.dataset.key].slice(-60);await saveAjustes();render();toast("Listo. No se sumó a caja.")}
  else if(a==="ajustarPres")openPresupuesto();
  else if(a==="nuevaMeta")openMeta(null);
  else if(a==="aportar"&&it)openAporte(it);
  else if(a==="retirarMeta"&&it)openAporte(it,"retirar");
  else if(a==="irDinero"){finMes=ymOf(today());go("dinero")}
  else if(a==="ir"){go(b.dataset.t)}
  else if(a==="instalar"){instalar()}
  else if(a==="nuevaTarjeta")openTarjeta(null);
  else if(a==="pagarTarjeta"&&it)openPagoTarjeta(it);
  else if(a==="compraTarjeta"&&it)openConsumo(it,null);
  else if(a==="editConsumo"){const tj=items.find(i=>i.id===b.dataset.t);const c=tj&&(tj.consumos||[]).find(x=>x.id===b.dataset.c);if(tj&&c)openConsumo(tj,c)}
  else if(a==="ejemplos")cargarEjemplos();
  else if(a==="borrarEjemplos"){for(const i of items.filter(x=>x.ejemplo))await deleteItem(i.id);toast("Ejemplos borrados")}
  else if(a==="pedirBorrarTodo"){$("#borrarTodoBox").innerHTML=`<div class="confirm">Se borra todo lo que anotaste. No se puede deshacer. Hacé antes una copia si la necesitás.<div class="btns" style="margin-top:8px"><button class="btn danger small" data-act="borrarTodo">Sí, borrar todo</button><button class="btn ghost small" data-act="cancelBorrar">Cancelar</button></div></div>`}
  else if(a==="cancelBorrar")$("#borrarTodoBox").innerHTML="";
  else if(a==="borrarTodo"){for(const i of [...items])await deleteItem(i.id);toast("Se borró todo")}
  else if(a==="exportar")exportar();
  else if(a==="copiarJson"){const ta=$("#jsonOut");try{await navigator.clipboard.writeText(ta.value);toast("Copiado")}catch{ta.focus();ta.select();toast("Seleccionado: copialo manualmente")}}
  else if(a==="ponerPin"){const v=$("#pinNew").value;if(!/^\d{4}$/.test(v)){toast("El PIN tiene que ser de 4 números");return}ajustes.pin=await hash(v);ajustes.pinLen=4;unlocked=true;await saveAjustes();render();toast("PIN activado")}
  else if(a==="quitarPin"){delete ajustes.pin;await saveAjustes();render();toast("PIN quitado")}
});

/* ---------- hoja de edición ---------- */
function openSheet(it){
  if(it.tipo==="mov")return Array.isArray(it.productos)?openCompra(it):openMoney(it);
  if(it.tipo==="pago")return openPago(it);
  if(it.tipo==="fijo")return openFijo(it);
  if(it.tipo==="meta")return openMeta(it);
  if(it.tipo==="tarjeta")return openTarjeta(it);
  const host=$("#sheetHost");
  host.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-label="Editar">
    <h3>Editar ${esc(TIPOS[it.tipo].toLowerCase())}</h3>
    <div class="field"><label for="eTexto">Texto</label><input id="eTexto" value="${esc(it.texto)}"></div>
    <div class="field"><label for="eDetalle">Detalle</label><textarea id="eDetalle" rows="2" placeholder="Opcional">${esc(it.detalle||"")}</textarea></div>
    <div class="row2"><div class="field"><label for="eTipo">Tipo</label><select id="eTipo">${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}" ${k===it.tipo?"selected":""}>${v}</option>`).join("")}</select></div>
    <div class="field"><label for="ePrio">Prioridad</label><select id="ePrio"><option value="normal">Normal</option><option value="alta" ${it.prioridad==="alta"?"selected":""}>Importante</option><option value="algun" ${it.prioridad==="algun"?"selected":""}>Algún día</option></select></div></div>
    <div class="row2"><div class="field"><label for="eFecha">Fecha</label><input id="eFecha" type="date" value="${esc(it.fecha||"")}"></div>
    <div class="field"><label for="eHora">Hora</label><input id="eHora" type="time" value="${esc(it.hora||"")}"></div></div>
    <div class="field"><label for="eRep">Repetir</label><select id="eRep">${Object.entries(REP).map(([k,v])=>`<option value="${k}" ${k===(it.repetir||"no")?"selected":""}>${v}</option>`).join("")}</select></div>
    <div class="foot"><button class="btn ghost" id="eDel">Borrar</button><div style="display:flex;gap:8px"><button class="btn ghost" id="eCancel">Cancelar</button><button class="btn" id="eSave">Guardar</button></div></div>
    <div id="eConfirm"></div></div></div>`;
  const close=()=>host.innerHTML="";
  $("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")close()});
  $("#eCancel").onclick=close;
  $("#eSave").onclick=()=>{
    const txt=$("#eTexto").value.trim();if(!txt){toast("Escribí un texto");return}
    saveItem({...it,texto:txt,detalle:$("#eDetalle").value.trim(),tipo:$("#eTipo").value,prioridad:$("#ePrio").value,fecha:$("#eFecha").value||null,hora:$("#eHora").value||null,repetir:$("#eRep").value});close();toast("Guardado");
  };
  $("#eDel").onclick=()=>{$("#eConfirm").innerHTML=`<div class="confirm">¿Borrar “${esc(it.texto)}”?<div class="btns" style="margin-top:8px;display:flex;gap:8px"><button class="btn danger small" id="eDelYes">Sí, borrar</button><button class="btn ghost small" id="eDelNo">No</button></div></div>`;
    $("#eDelYes").onclick=()=>{deleteItem(it.id);close();toast("Borrado")};$("#eDelNo").onclick=()=>$("#eConfirm").innerHTML=""};
}

/* ---------- copia de seguridad ---------- */
async function exportar(){
  const {pin,pinLen,...aj}=ajustes;
  const data=JSON.stringify({app:"brujula",version:2,exportado:new Date().toISOString(),ajustes:aj,items},null,1);
  const name=`brujula-copia-${today()}.json`;
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch{}
  if(dl){try{await dl.save({filename:name,data});toast("Copia lista");return}catch(e){if(e&&e.code&&/declin|cancel/i.test(e.code)){toast("Copia cancelada");return}}}
  if(!window.claude){
    try{const file=new File([data],name,{type:"application/json"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Copia de Brújula"});toast("Copia lista");return}}catch(e){if(e&&e.name==="AbortError"){toast("Copia cancelada");return}}
    try{const u=URL.createObjectURL(new Blob([data],{type:"application/json"}));const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast("Copia descargada");return}catch{}
  }
  if(!$("#expOut"))return;
  $("#expOut").innerHTML=`<p style="margin-top:12px">Copiá este texto y guardalo en una nota o archivo:</p><textarea class="json" id="jsonOut" readonly>${esc(data)}</textarea><div class="btns" style="margin-top:8px"><button class="btn ghost small" data-act="copiarJson">Copiar</button></div>`;
}
function importar(e){
  const file=e.target.files&&e.target.files[0];if(!file)return;
  const fr=new FileReader();
  fr.onload=async()=>{
    try{const j=JSON.parse(fr.result);if(!Array.isArray(j.items))throw 0;
      const ids=new Set(items.map(i=>i.id));let n=0;
      for(const it of j.items){if(it&&it.id&&it.texto&&!ids.has(it.id)&&it.id!=="ajustes"){await saveItem(it);n++}}
      if(j.ajustes&&typeof j.ajustes==="object"){let c=false;for(const k of ["sueldo","ahorroPct","presupuesto","cobrosSaltados"])if(j.ajustes[k]!=null&&ajustes[k]==null){ajustes[k]=j.ajustes[k];c=true}if(c){await saveAjustes();render()}}
      toast(n?`Se recuperaron ${n} elementos`:"No había nada nuevo en esa copia");
    }catch{toast("Ese archivo no es una copia de Brújula o Zeta")}
  };
  fr.readAsText(file);
}

/* ---------- ejemplos ---------- */

  const t=today();const ej=[

    {tipo:"fecha",texto:"Cumple de mamá",fecha:addDays(t,5),repetir:"anual"},
    {tipo:"tarea",texto:"Aprender a hacer videos para redes",prioridad:"algun"},
    {tipo:"nota",texto:"Idea: promo de verano para el local"}

  const hoyD=new Date();const dia=(k,d)=>{const x=new Date(hoyD.getFullYear(),hoyD.getMonth()-k,1);const max=k===0?hoyD.getDate():new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(d,max));return iso(x)};

  });

  ej.push({tipo:"meta",texto:"Heladera nueva",objetivo:3500000,inicial:400000,aporte:300000,limite:`${ymAdd(ymOf(t),8)}-01`,aportes:[{fecha:t,monto:300000}]});
  ej.push({tipo:"fijo",texto:"Préstamo del banco",monto:450000,dia:20,categoria:"Cuotas y deudas",saltar:[],cuotas:20,cuotasPrevias:5});
  const precios={Leche:[5200,5500,5700],Pan:[3000,3000,3200],"Queso paraguay":[27000,28000,29500],Arroz:[8500,8900,8700],Aceite:[16500,17000,18500]};
  [2,1,0].forEach((k,j)=>ej.push({tipo:"mov",clase:"gasto",texto:"Supermercado",categoria:"Comida",fecha:dia(k,16),productos:Object.entries(precios).map(([n,v])=>({nombre:n,cant:n==="Leche"?4:n==="Pan"?5:1,precio:v[j]})),monto:Object.entries(precios).reduce((a,[n,v])=>a+v[j]*(n==="Leche"?4:n==="Pan"?5:1),0)}));
  ej.push({tipo:"tarjeta",texto:"Visa del banco",saldoInicial:2500000,minimo:250000,diaVence:5,limite:5000000,interes:3.5,consumos:[{id:uid(),fecha:dia(0,12),monto:180000,texto:"Zapatillas",categoria:"Ropa y personal"},{id:uid(),fecha:dia(0,18),monto:95000,texto:"Farmacia",categoria:"Salud"}]});
  ej.push({tipo:"pago",texto:"Cuota de la moto",monto:650000,fecha:addDays(t,5),categoria:"Cuotas y deudas",repetir:"mensual"});
  for(const e of ej)await saveItem({id:uid(),hora:null,repetir:"no",prioridad:"normal",estado:"pendiente",detalle:"",creado:Date.now(),ejemplo:true,fecha:null,...e});
