<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brújula</title>
<meta name="description" content="Tu día y tu plata, en orden.">
<meta name="theme-color" content="#081226">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brújula">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}
body{overscroll-behavior-y:none}
.wrap{padding-top:calc(18px + env(safe-area-inset-top,0px))!important}
</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: app de una columna, encabezado por sección, barra de navegación fija abajo. Tema único azul noche. */
:root{
  --bg:#081226; --surface:#10203F; --sunk:#0D1B36; --raise:#16294F; --ink:#EAF1FF; --muted:#8FA3C7; --line:rgba(127,160,230,.16);
  --accent:#3B82F6; --accent-2:#2563EB; --accent-soft:#8DB8FF; --accent-ink:#FFFFFF; --sun:#F7C948; --sun-ink:#2A1F00;
  --ok:#4ADE9B; --ok-ink:#062A1B; --warn:#FF7A85; --warn-ink:#2A0509; --violet:#B69CFF;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --f-display:"Sora","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"Sora","Segoe UI",system-ui,sans-serif;
  --r:18px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);background-image:radial-gradient(120% 50% at 50% -8%,#15305E 0%,rgba(8,18,38,0) 60%);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.hello{font-size:.9rem;color:var(--muted);font-weight:500}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.7rem,7vw,2.2rem);line-height:1.05;margin:2px 0 0;letter-spacing:-.01em;text-wrap:balance}
h1 .sun{display:inline-block;width:.42em;height:.42em;border-radius:50%;background:var(--sun);margin-left:.18em;vertical-align:.12em}
.brand{font-family:var(--f-display);font-weight:700;font-size:.85rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

.counts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.count{font-size:.82rem;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:600}
.count b{color:var(--ink)}
.count.warn b{color:var(--warn)}

/* Captura */
.capture{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);margin-bottom:22px}
.capture form{display:flex;gap:8px}
.capture input{flex:1;min-width:0;border:0;background:transparent;font-size:1.05rem;padding:8px 4px;outline:none}
.capture input::placeholder{color:var(--muted)}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--warn);color:#fff}
.btn.small{padding:6px 10px;font-size:.85rem;border-radius:8px}
.preview{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:.82rem;color:var(--muted)}
.preview[hidden]{display:none}
.tchip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:600;color:var(--muted)}
.tchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{font-size:.8rem;color:var(--muted);margin-top:6px}

/* Secciones */
section.block{margin-bottom:22px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 8px}
h2{font-family:var(--f-display);font-weight:700;font-size:1.15rem;margin:0}
.sh small{color:var(--muted);font-size:.8rem}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list:empty{display:none}
.empty{color:var(--muted);font-size:.9rem;padding:14px;border:1px dashed var(--line);border-radius:var(--r)}

.top3 .list{border-color:color-mix(in srgb,var(--sun) 55%,var(--line))}
.top3 .item .num{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--sun);color:var(--sun-ink);font-weight:700;font-size:.85rem;flex:none;margin-top:1px}

.item{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);background:transparent;margin-top:1px;display:grid;place-items:center;padding:0}
.check.on{background:var(--ok);border-color:var(--ok)}
.check.on::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.item .body{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0}
.item .txt{display:block;overflow-wrap:anywhere}
.item.done .txt{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px;font-size:.78rem;color:var(--muted)}
.meta .time{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.meta .late{color:var(--warn);font-weight:600}
.meta .hi{color:var(--warn);font-weight:700}
.tag{border-radius:6px;padding:0 6px;background:var(--sunk)}
.star{flex:none;border:0;background:none;padding:2px 4px;font-size:1.15rem;line-height:1;color:var(--muted)}
.star.on{color:var(--sun)}
.acts{display:flex;gap:6px;margin-top:8px}
.ev-time{flex:none;width:52px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.9rem;padding-top:2px}
.dayh{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px 4px;background:var(--sunk)}

.seg{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;margin-bottom:12px}

/* Navegación */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{border:0;background:none;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* Hoja de edición */
.scrim{position:fixed;inset:0;background:rgba(10,14,24,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:90%;overflow:auto}
.sheet h3{font-family:var(--f-display);margin:0 0 12px;font-size:1.2rem}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:6px}
.confirm{background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid var(--warn);border-radius:10px;padding:10px;margin-top:10px;font-size:.9rem}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.card p{margin:0 0 10px;color:var(--muted);font-size:.92rem}
.card .btns{display:flex;flex-wrap:wrap;gap:8px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.status.local i{background:var(--sun)}
textarea.json{width:100%;min-height:110px;font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg)}

.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:.88rem;font-weight:600;z-index:60;max-width:calc(100% - 32px)}

/* Dinero */
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.mbox span{display:block;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.mbox b{display:block;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500;font-size:clamp(.8rem,3.5vw,1.02rem);margin-top:3px;overflow-wrap:anywhere}
.mbox.main{border-color:var(--ink)}
.pos{color:var(--ok)!important}.neg{color:var(--warn)!important}
.caja{font-size:.85rem;color:var(--muted);margin:0 0 14px}
.caja b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.mnav button{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:42px;height:38px;font-size:1.15rem}
.mnav button:disabled{opacity:.35}
.mnav strong{font-family:var(--f-display);font-size:1.15rem}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.btn.in{background:var(--ok);color:var(--surface)}.btn.out{background:var(--warn);color:var(--surface)}
.amt{flex:none;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.9rem;padding-top:1px;white-space:nowrap}
.mico{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:1rem;margin-top:1px}
.mico.in{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.mico.out{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.bars{display:flex;flex-direction:column;gap:10px;padding:12px}
.bar .lab{display:flex;justify-content:space-between;gap:8px;font-size:.88rem}
.bar .lab b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.bar .trk{height:8px;border-radius:4px;background:var(--sunk);margin-top:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:4px}
.hist{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;height:120px;padding:14px 12px 0;border-bottom:1px solid var(--line);margin:0 12px;padding-inline:0}
.hcol{display:flex;gap:3px;align-items:flex-end;justify-content:center;height:100%}
.hcol i{display:block;width:38%;max-width:14px;border-radius:3px 3px 0 0;min-height:2px}
.hcol .in{background:var(--ok)}.hcol .out{background:var(--warn)}
.hlab{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:6px 12px 2px;font-size:.72rem;color:var(--muted);text-align:center}
.hlab .cur{color:var(--ink);font-weight:700}
.hsal{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:0 12px 10px;font-size:.66rem;text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;font-size:.75rem;color:var(--muted);padding:10px 12px 0}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.tips{display:flex;flex-direction:column;gap:12px}
.tip{display:flex;gap:10px;align-items:flex-start;font-size:.93rem;line-height:1.45}
.tip .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--sun);margin-top:7px}
.tip b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.savecard{border-color:color-mix(in srgb,var(--sun) 60%,var(--line))}
.lock{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
.lock h2{font-size:1.5rem}
.lock input{font-family:var(--f-mono);font-size:1.6rem;letter-spacing:.5em;text-align:center;width:180px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface)}
@media (prefers-reduced-motion:no-preference){.item{transition:background .15s}.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}

/* ===== Brújula 1.1: tema azul noche ===== */
h1{font-weight:600;font-size:clamp(1.55rem,6.4vw,1.9rem)}
h1 .sun{background:var(--accent);width:.32em;height:.32em}
.brand{color:var(--accent-soft);letter-spacing:.12em;font-size:.8rem}
.hello{font-weight:600}
h2{font-weight:600;font-size:1.08rem}
.list,.card,.capture{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:none}
.capture{box-shadow:var(--shadow)}
.empty{border-color:var(--line);background:rgba(16,32,63,.5)}
.btn{background:linear-gradient(180deg,var(--accent),var(--accent-2));color:#fff;border-radius:14px;min-height:44px;box-shadow:0 6px 18px rgba(37,99,235,.3);transition:transform .12s}
.btn.small{min-height:34px;box-shadow:none}
.btn.ghost{background:rgba(127,160,230,.13);color:var(--ink);box-shadow:none}
.btn.in{background:var(--ok);color:var(--ok-ink);box-shadow:none}
.btn.out{background:var(--warn);color:var(--warn-ink);box-shadow:none}
.btn.danger{background:var(--warn);color:var(--warn-ink)}
.btn:active,.check:active,.star:active,.tile:active,.mrow:active{transform:scale(.96)}
.count{background:rgba(127,160,230,.12);color:var(--muted)}
.tchip{border-color:var(--line);color:var(--muted)}
.tchip[aria-pressed="true"]{background:var(--accent-2);color:#fff;border-color:var(--accent-2)}
.check{border-color:#4A5F88}
.item{border-top-color:var(--line)}
.dayh{background:var(--sunk);color:var(--accent-soft)}
.top3 .list{border-color:rgba(247,201,72,.35)}
.mbox{background:var(--surface);border-color:var(--line)}
.mbox.main{border-color:var(--accent)}
.field input,.field select,.field textarea,.search{background:var(--sunk);border-color:var(--line)}
.scrim{background:rgba(3,8,20,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{background:var(--surface);border-top:1px solid var(--line);border-radius:24px 24px 0 0}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:rgba(127,160,230,.35);margin:-6px auto 12px}
.toast{background:var(--ink);color:var(--bg)}
.lock{background:var(--bg)}
.status i{background:var(--ok)}
.bar .fill{background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.hcol .in{background:var(--ok)}.hcol .out{background:var(--warn)}
.savecard{border-color:rgba(247,201,72,.35)}
.confirm{background:rgba(255,122,133,.1)}
textarea.json{background:var(--sunk)}

/* encabezado y héroe */
.hero{border-radius:22px;padding:18px;background:linear-gradient(160deg,#1A4384 0%,#10203F 72%);border:1px solid rgba(127,176,255,.22);margin-bottom:12px;position:relative;overflow:hidden}
.hero .lbl{font-size:.88rem;font-weight:700;color:#CFE0FF}
.hero .big{font-family:var(--f-display);font-weight:600;font-size:clamp(1.9rem,9vw,2.4rem);color:#9CC2FF;line-height:1.15;margin-top:4px;overflow-wrap:anywhere}
.hero .sm{font-size:.82rem;color:var(--muted);font-weight:600;margin-top:4px}
.hero .sm b{color:var(--ink)}
.hero.gold{background:linear-gradient(160deg,#4A3D12 0%,#10203F 72%);border-color:rgba(247,201,72,.3)}
.hero.gold .big{color:var(--sun)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;color:inherit;min-width:0;transition:transform .12s}
.tile .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.tile .t{font-size:.8rem;color:var(--muted);font-weight:700}
.tile .v{font-family:var(--f-display);font-weight:600;font-size:1.02rem;overflow-wrap:anywhere}
.ic.g{background:rgba(74,222,155,.16);color:var(--ok)}.ic.r{background:rgba(255,122,133,.16);color:var(--warn)}
.ic.b{background:rgba(111,165,255,.16);color:#7FB0FF}.ic.y{background:rgba(247,201,72,.16);color:var(--sun)}.ic.p{background:rgba(182,156,255,.16);color:var(--violet)}
.tile.gold{background:linear-gradient(160deg,#3A3216,var(--surface) 75%)}
.g-t{color:var(--ok)}.r-t{color:var(--warn)}.y-t{color:var(--sun)}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--accent-soft);font-weight:700;padding:6px 0;margin:-6px 0 8px;min-height:40px}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border:0;background:none;color:inherit;text-align:left;border-top:1px solid var(--line);transition:transform .12s}
.mrow:first-child{border-top:0}
.mrow .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.mrow .tx{flex:1;min-width:0}.mrow .tx b{display:block;font-size:.98rem}.mrow .tx span{font-size:.8rem;color:var(--muted);font-weight:600}
.mrow .chev{color:var(--muted)}
.seg2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--sunk);border-radius:14px;padding:4px;margin-bottom:16px;position:relative}
.seg2 button{position:relative;z-index:1;border:0;background:none;color:var(--muted);font-weight:700;font-size:.82rem;height:38px;border-radius:10px;transition:color .2s}
.seg2 button[aria-pressed="true"]{color:#fff}
.seg2 .ind{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;border-radius:10px;background:var(--accent-2);transition:transform .3s cubic-bezier(.2,.8,.2,1);width:calc((100% - 8px - 12px)/4)}

/* tarjeta de crédito */
.ccard{position:relative;border-radius:20px;padding:16px;color:#fff;overflow:hidden;background:linear-gradient(135deg,#2B4FB8 0%,#5B3BC4 55%,#1B2A66 100%);box-shadow:0 12px 30px rgba(37,60,170,.35);border:1px solid rgba(255,255,255,.12)}
.ccard::after{content:"";position:absolute;right:-40px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.ccard .row1{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1}
.ccard .nm{border:0;background:none;color:#fff;font:700 1rem var(--f-display);padding:0;text-align:left;min-height:32px}
.ccard .chip{width:34px;height:24px;border-radius:6px;background:linear-gradient(135deg,#F7D774,#C99A2E);flex:none}
.ccard .lbl{font-size:.78rem;color:rgba(255,255,255,.75);font-weight:700;margin-top:12px;position:relative;z-index:1}
.ccard .debt{font-family:var(--f-display);font-weight:600;font-size:clamp(1.6rem,8vw,2rem);position:relative;z-index:1;overflow-wrap:anywhere}
.ccard .use{height:6px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:10px;position:relative;z-index:1}
.ccard .use i{display:block;height:100%;background:#fff;border-radius:3px}

<script>
(() => {
"use strict";
/* ---------- utilidades de fecha ---------- */
const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const DIAS_N=["domingo","lunes","martes","miercoles","jueves","viernes","sabado"];
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=fromIso(s);d.setDate(d.getDate()+n);return iso(d)};
const today=()=>iso(new Date());
function addInterval(s,rep){
  const d=fromIso(s);
  if(rep==="diario")d.setDate(d.getDate()+1);
  else if(rep==="semanal")d.setDate(d.getDate()+7);
  else if(rep==="mensual"){const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}
  else if(rep==="anual")d.setFullYear(d.getFullYear()+1);
  return iso(d);
}
function niceDate(s){
  const t=today();
  if(s===t)return "Hoy";
  if(s===addDays(t,1))return "Mañana";
  if(s===addDays(t,-1))return "Ayer";
  const d=fromIso(s);const diff=Math.round((d-fromIso(t))/864e5);
  if(diff>1&&diff<7)return DIAS[d.getDay()][0].toUpperCase()+DIAS[d.getDay()].slice(1);
  return `${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}`+(d.getFullYear()!==new Date().getFullYear()?` ${d.getFullYear()}`:"");
}
function longDate(s){const d=fromIso(s);return `${DIAS[d.getDay()][0].toUpperCase()+DIAS[d.getDay()].slice(1)} ${d.getDate()} de ${MESES[d.getMonth()]}`}
/* fecha efectiva: las fechas anuales pasadas se muestran en su próxima ocurrencia */
function eff(it){
  if(!it.fecha)return null;
  if(it.tipo==="fecha"&&it.repetir==="anual"){let f=it.fecha;const t=today();let g=0;while(f<t&&g++<200)f=addInterval(f,"anual");return f}
  return it.fecha;
}

/* ---------- interpretación de texto ---------- */
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function parse(raw){
  const t=raw.normalize("NFC");const n=norm(t);const cuts=[];
  const r={tipo:null,fecha:null,hora:null,repetir:"no",prioridad:"normal"};
  const take=(re,fn)=>{const m=re.exec(n);if(!m)return false;if(fn(m)===false)return false;cuts.push([m.index,m.index+m[0].length]);return true};
  const now=today();
  take(/^(nota|idea)\s*:?\s*/,()=>{r.tipo="nota"});
  // dinero
  if(r.tipo!=="nota"){
    const m=findMonto(n);
    if(m&&!m.sign&&PAGO_RE.test(n)){
      r.tipo="pago";r.monto=m.valor;r.categoria=catFor(n,"gasto");cuts.push([m.start,m.end]);
      take(/\b(tengo\s+que\s+pagar|hay\s+que\s+pagar|tengo\s+que\s+abonar|debo|pagar|abonar|vence(?:\s+(?:la|el))?)\b/,()=>{});
    }else if(m){
      let clase=m.sign==="-"?"gasto":m.sign==="+"?"ingreso":INGRESO_RE.test(n)?"ingreso":GASTO_RE.test(n)?"gasto":null;
      if(clase){r.tipo="mov";r.clase=clase;r.monto=m.valor;r.categoria=catFor(n,clase);cuts.push([m.start,m.end]);
        take(/\b(pague|gaste|compre|abone|cobre|me\s+pagaron|recibi|vendi|gane|me\s+depositaron|me\s+transfirieron)\b/,()=>{});}
    }
  }
  take(/\b(cada\s+(dia|semana|mes|ano)|todos\s+los\s+(dias|meses|anos)|todas\s+las\s+semanas|diario|semanal|mensual|anual)\b/,m=>{
    const w=m[0];r.repetir=/dia|diario/.test(w)?"diario":/semana/.test(w)?"semanal":/mes|mensual/.test(w)?"mensual":"anual"});
  take(/!+|\burgente\b/,()=>{r.prioridad="alta"});
  take(/\balgun\s+dia\b/,()=>{r.prioridad="algun"});
  // fecha
  take(/\bpasado\s+manana\b/,()=>{r.fecha=addDays(now,2)})||
  take(/\bmanana\b/,()=>{r.fecha=addDays(now,1)})||
  take(/\bhoy\b/,()=>{r.fecha=now})||
  take(/\bayer\b/,()=>{r.fecha=addDays(now,-1)})||
  take(/\b(?:el\s+)?(\d{1,2})\s+de\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)(?:\s+(?:de\s+)?(\d{4}))?\b/,m=>{
    let mi=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"].indexOf(m[2]);if(m[2]==="setiembre")mi=8;
    const d=+m[1];if(d<1||d>31)return false;let y=m[3]?+m[3]:new Date().getFullYear();let f=`${y}-${pad(mi+1)}-${pad(d)}`;if(!m[3]&&f<now)f=`${y+1}-${pad(mi+1)}-${pad(d)}`;r.fecha=f})||
  take(/\b(?:el\s+)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/,m=>{
    const d=+m[1],mo=+m[2];if(d<1||d>31||mo<1||mo>12)return false;let y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):new Date().getFullYear();
    let f=`${y}-${pad(mo)}-${pad(d)}`;if(!m[3]&&f<now)f=`${y+1}-${pad(mo)}-${pad(d)}`;r.fecha=f})||
  take(/\b(?:el\s+|este\s+|proximo\s+)?(lunes|martes|miercoles|jueves|viernes|sabado|domingo)\b/,m=>{
    const target=DIAS_N.indexOf(m[1]);const cur=new Date().getDay();let diff=(target-cur+7)%7;if(diff===0)diff=7;r.fecha=addDays(now,diff)});
  // hora
  const setH=(h,mi)=>{h=+h;mi=mi?+mi:0;if(h>23||mi>59)return false;r.hora=`${pad(h)}:${pad(mi)}`};
  take(/\b(?:a\s+las\s+)?(\d{1,2})(?::(\d{2}))?\s*(?:hs|hrs|h)\b/,m=>setH(m[1],m[2]))||
  take(/\b(?:a\s+las\s+)?(\d{1,2}):(\d{2})\b/,m=>setH(m[1],m[2]))||
  take(/\ba\s+las\s+(\d{1,2})\b/,m=>setH(m[1]));
  if(r.tipo==="mov"){r.fecha=r.fecha||now;r.hora=null}
  else if(r.tipo==="pago"){r.hora=null}
  else if(/\b(cumple|cumpleanos|aniversario)\b/.test(n)){r.tipo="fecha";if(r.repetir==="no")r.repetir="anual"}
  if(!r.tipo)r.tipo=r.hora?"evento":"tarea";
  if(r.tipo==="evento"&&!r.fecha)r.fecha=now;
  // limpiar texto
  let out=t;cuts.sort((a,b)=>b[0]-a[0]).forEach(([a,b])=>{out=out.slice(0,a)+" "+out.slice(b)});
  out=out.replace(/\s+/g," ").trim();
  for(let i=0;i<3;i++){out=out.replace(/^(de|el|a\s+las|a|para|y|en|por|,|-)\s+/i,"").replace(/\s+(de|el|a\s+las|a|para|y|en|por|,|-)$/i,"").replace(/[,\-–:.\s]+$/,"").trim()}
  if(!out)out=t.trim();
  r.texto=out.charAt(0).toUpperCase()+out.slice(1);
  return r;
}

/* ---------- dinero ---------- */
const PAGO_RE=/\b(tengo\s+que\s+pagar|hay\s+que\s+pagar|tengo\s+que\s+abonar|debo|pagar|abonar|vence|vencimiento|a\s+pagar)\b/;
const pagosPend=()=>items.filter(i=>i.tipo==="pago"&&i.estado!=="hecho");
/* sueldo y cuentas fijas */
const sueldoCfg=()=>ajustes.sueldo&&+ajustes.sueldo.monto?ajustes.sueldo:null;
const diaEnMes=(ym,d)=>{const [y,m]=ym.split("-").map(Number);const max=new Date(y,m,0).getDate();return `${ym}-${pad(Math.min(d,max))}`};
function cobrosDe(ym){const s=sueldoCfg();if(!s)return [];const dias=(s.dias&&s.dias.length?s.dias:[1]).map(Number).sort((a,b)=>a-b);const parte=Math.round(s.monto/dias.length);const salt=ajustes.cobrosSaltados||[];
  return dias.map(d=>{const key=`${ym}-${pad(d)}`;const mov=items.find(i=>i.tipo==="mov"&&i.cobroKey===key);return {key,fecha:diaEnMes(ym,d),monto:parte,mov,saltado:salt.includes(key)}})}
const fijos=()=>items.filter(i=>i.tipo==="fijo").sort((a,b)=>(+a.dia||0)-(+b.dia||0));
function cuotaInfo(f){
  const total=+f.cuotas||0;if(!total)return null;
  const pagadas=Math.min(total,(+f.cuotasPrevias||0)+items.filter(i=>i.tipo==="mov"&&i.fijoId===f.id).length+(f.saltar||[]).length);
  const restantes=total-pagadas;const cur=ymOf(today());
  const esteMesListo=items.some(i=>i.tipo==="mov"&&i.fijoId===f.id&&i.fijoMes===cur)||(f.saltar||[]).includes(cur);
  const proxima=esteMesListo?ymAdd(cur,1):cur;
  return {total,pagadas,restantes,termina:restantes>0?ymAdd(proxima,restantes-1):null,deuda:restantes*(+f.monto||0)};
}
const fijoTerminado=f=>{const c=cuotaInfo(f);return !!c&&c.restantes<=0};
function fijosDe(ym){return fijos().map(f=>({f,ym,fecha:diaEnMes(ym,+f.dia||1),mov:items.find(i=>i.tipo==="mov"&&i.fijoId===f.id&&i.fijoMes===ym),saltado:(f.saltar||[]).includes(ym)})).filter(x=>!fijoTerminado(x.f)||x.mov||x.saltado)}
const fijoListo=x=>x.mov||x.saltado;
function fijosPendHasta(hasta){const t=today();const cur=ymOf(t);return [cur,ymAdd(cur,1)].flatMap(fijosDe).filter(x=>!fijoListo(x)&&x.fecha<=hasta&&(x.fecha>=t||ymOf(x.fecha)===cur))}
const PRES_BASE={"Comida":45,"Transporte":20,"Salidas y ocio":10,"Ropa y personal":10,"Salud":10,"Otros gastos":5};
function planMes(){const s=sueldoCfg();if(!s)return null;const S=+s.monto;const F=fijos().filter(f=>!fijoTerminado(f)).reduce((a,f)=>a+(+f.monto||0),0);const pct=+ajustes.ahorroPct||10;const A=Math.round(S*pct/100);const libre=S-F-A;const custom=ajustes.presupuesto||{};
  const cats=Object.keys(PRES_BASE).map(c=>[c,custom[c]!=null?+custom[c]:Math.max(0,Math.round(libre*PRES_BASE[c]/100/1000)*1000)]);
  return {S,F,A,pct,libre,cats,custom:Object.keys(custom).length>0}}
const GASTO_RE=/\b(pague|gaste|compre|abone|gasto|pago\s+de)\b/;
const INGRESO_RE=/\b(cobre|cobro|me\s+pagaron|ingreso|sueldo|salario|aguinaldo|venta|vendi|gane|recibi|me\s+depositaron|me\s+transfirieron)\b/;
function findMonto(n){
  const re=/(^|[\s(])([+-])?\s*(?:gs\.?\s*)?(\d{1,3}(?:[.,]\d{3})+|\d+)(\s*(?:mil|k)\b)?/g;let m;
  while((m=re.exec(n))){
    const num=m[3];const after=n.slice(re.lastIndex,re.lastIndex+3);const sep=/[.,]/.test(num);const mil=!!m[4];
    if(/^\s*[\/:]|^\s*(hs|h\b|hrs)/.test(after))continue;
    if(!sep&&!mil&&num.length<3)continue;
    let v=Number(num.replace(/[.,]/g,""));if(mil)v*=1000;if(!v)continue;
    const start=m.index+m[1].length;return {valor:v,sign:m[2]||null,start,end:re.lastIndex};
  }
  return null;
}
const CATS_G=[["Comida",/super|despensa|almuerzo|cena|comida|desayuno|\bpan\b|carne|verdura|fruta|delivery|pizza|hamburguesa|mercado|chipa|gaseosa/],["Transporte",/nafta|combustible|gasolina|diesel|taxi|bolt|uber|colectivo|pasaje|peaje|estacionamiento|taller|aceite|neumatico|cubierta|mecanico/],["Casa y servicios",/\bluz\b|ande|\bagua\b|essap|alquiler|internet|tigo|personal|claro|copaco|garrafa|\bgas\b|limpieza|expensa|ferreteria|pintura/],["Cuotas y deudas",/cuota|prestamo|tarjeta|deuda|credito/],["Salud",/farmacia|medico|remedio|consulta|clinica|odonto|dentista|analisis/],["Ropa y personal",/ropa|zapat|champion|peluqueria|barberia|perfume|corte/],["Salidas y ocio",/salida|cine|cerveza|\bbar\b|restaurante|regalo|cumple|juego|netflix|spotify|streaming|paseo/],["Educación",/colegio|escuela|curso|libro|utiles|facultad|universidad/]];
const CATS_I=[["Sueldo",/sueldo|salario|aguinaldo|quincena|jornal/],["Ventas",/venta|vendi|cliente|insumo/],["Trabajos extra",/trabajo|changa|extra|servicio|comision/]];
const CAT_LIST={gasto:[...CATS_G.map(c=>c[0]),"Otros gastos"],ingreso:[...CATS_I.map(c=>c[0]),"Otros ingresos"]};
function catFor(n,clase){const l=clase==="ingreso"?CATS_I:CATS_G;for(const [c,re] of l)if(re.test(n))return c;return clase==="ingreso"?"Otros ingresos":"Otros gastos"}
const fmt=v=>(v<0?"-":"")+"Gs. "+String(Math.round(Math.abs(v))).replace(/\B(?=(\d{3})+(?!\d))/g,".");
const ymOf=s=>(s||"").slice(0,7);
const ymAdd=(ym,k)=>{const [y,m]=ym.split("-").map(Number);const d=new Date(y,m-1+k,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const ymName=ym=>{const [y,m]=ym.split("-").map(Number);return MESES[m-1][0].toUpperCase()+MESES[m-1].slice(1)+" "+y};
const movsDe=ym=>items.filter(i=>i.tipo==="mov"&&ymOf(i.fecha)===ym);
const suma=(arr,clase)=>arr.filter(i=>i.clase===clase).reduce((s,i)=>s+(+i.monto||0),0);

/* ---------- almacenamiento ---------- */
const LS_KEY="brujula-v1";
let items=[];let ajustes={};let mode="cargando";let col=null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function lsRead(){try{const j=JSON.parse(localStorage.getItem(LS_KEY)||"{}");return j}catch{return {}}}
function lsWrite(){try{localStorage.setItem(LS_KEY,JSON.stringify({items,ajustes}))}catch{}}
async function saveItem(it){
  it.modificado=Date.now();
  const i=items.findIndex(x=>x.id===it.id);if(i>=0)items[i]=it;else items.push(it);
  render();
  if(mode==="nube"){try{await col.doc(it.id).set(it)}catch(e){toast(e&&e.code==="quota_exceeded"?"Se llenó el espacio. Borrá cosas viejas para seguir anotando.":"No se pudo guardar. Revisá tu conexión.")}}
  else lsWrite();
}
async function deleteItem(id){
  items=items.filter(x=>x.id!==id);render();
  if(mode==="nube"){try{await col.doc(id).delete()}catch{toast("No se pudo borrar. Probá de nuevo.")}}else lsWrite();
}
async function saveAjustes(){
  if(mode==="nube"){try{await col.doc("ajustes").set(ajustes)}catch{toast("No se pudieron guardar los ajustes.")}}else lsWrite();
}
async function initStore(){
  let db=null,user=null,id=null;
  try{if(window.claude&&typeof window.claude.use==="function"){[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);if(user)id=await user.id()}}catch{}
  if(db&&id){
    mode="nube";col=db.collection("data/users/"+id);
    col.onSnapshot(snap=>{
      const next=[];let aj={};
      snap.docs.forEach(d=>{if(d.id==="ajustes")aj={...d.data()};else next.push({...d.data(),id:d.id})});
      items=next;const hadPin=!!ajustes.pin;ajustes=aj;
      if(!hadPin&&ajustes.pin&&!unlocked)showLock();
      render();
    },()=>{toast("Se perdió la conexión con tus datos. Recargá la página.")});
  }else{
    mode="local";try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}const j=lsRead();items=Array.isArray(j.items)?j.items:[];ajustes=j.ajustes||{};
    if(ajustes.pin)showLock();
    render();
  }
}

let unlocked=false;
async function hash(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("zeta:"+s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}catch{return "p:"+s}}
function showLock(){
  const h=document.getElementById("lockHost");
  h.innerHTML=`<div class="lock" role="dialog" aria-label="Desbloquear"><div class="brand">BRÚJULA</div><h2>Ingresá tu PIN</h2><input id="pinIn" type="password" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="PIN"><div class="hint" id="pinMsg"></div></div>`;
  const inp=document.getElementById("pinIn");setTimeout(()=>inp.focus(),50);
  inp.addEventListener("input",async()=>{
    if(inp.value.length<4)return;
    if(await hash(inp.value)===ajustes.pin){unlocked=true;h.innerHTML=""}
    else if(inp.value.length>=6||inp.value.length===(ajustes.pinLen||4)){document.getElementById("pinMsg").textContent="PIN incorrecto. Probá de nuevo.";inp.value=""}
  });
}

function metaHtml(it,opts={}){
  const parts=[];const f=eff(it);const t=today();

  if(it.repetir&&it.repetir!=="no")parts.push(`<span>↻ ${esc(REP[it.repetir].toLowerCase())}</span>`);
  if(it.prioridad==="alta")parts.push(`<span class="hi">Importante</span>`);

function consejos(ym,mes){
  const pct=+ajustes.ahorroPct||10;const ing=suma(mes,"ingreso"),gas=suma(mes,"gasto"),saldo=ing-gas;const out=[];
  if(!mes.length&&!sueldoCfg())return [`Anotá lo que cobrás y lo que gastás en ${esc(ymName(ym).split(" ")[0].toLowerCase())} y acá vas a ver cuánto podés ahorrar.`];
  const plan=planMes();const cobros=cobrosDe(ym);
  if(plan){const porCobro=Math.round(plan.A/Math.max(1,cobros.length)/1000)*1000;
    out.push(`Ahorrá apenas cobrás: apartá <b>${fmt(porCobro)}</b> de cada cobro${cobros.length>1?` (los días ${cobros.map(c=>+c.key.slice(8)).join(" y ")})`:""} y en un año juntás <b>${fmt(plan.A*12)}</b>.`);
    const com=plan.cats.find(c=>c[0]==="Comida");if(com&&com[1]>0)out.push(`Para comida, tu tope es <b>${fmt(com[1])}</b> al mes: unos <b>${fmt(Math.round(com[1]/4.3/1000)*1000)}</b> por semana.`);
    if(plan.libre<0)out.push(`Tus cuentas fijas más el ahorro superan tu sueldo por <b>${fmt(-plan.libre)}</b>. Revisá qué cuenta fija podés bajar o pausar.`);}
  if(ing>0&&!plan){const meta=ing*pct/100;
    out.push(`Meta de ahorro (${pct}% de lo que entró): <b>${fmt(meta)}</b>. `+(saldo>=meta?"Ya la cubrís con lo que te sobra. ¡Apartala apenas cobrás!":saldo>0?`Te sobran ${fmt(saldo)}; te faltan <b>${fmt(meta-saldo)}</b> para llegar.`:"Este mes todavía no te alcanza para ahorrar."));}
  if(saldo>0&&!plan)out.push(`Te sobran <b>${fmt(saldo)}</b> este mes. Si guardás eso todos los meses, en un año juntás <b>${fmt(saldo*12)}</b>.`);
  else if(saldo<0)out.push(`Gastaste <b>${fmt(-saldo)}</b> más de lo que entró. Mirá las categorías de abajo para ver dónde recortar.`);
  const porCat={};mes.filter(i=>i.clase==="gasto").forEach(i=>porCat[i.categoria]=(porCat[i.categoria]||0)+(+i.monto||0));
  const cats=Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  const fijas=["Cuotas y deudas","Casa y servicios"];
  const recortable=cats.find(c=>!fijas.includes(c[0]));
  if(recortable&&gas>0)out.push(`Donde más podés recortar es <b style="font-family:var(--f-body);font-weight:700">${esc(recortable[0])}</b>: ${fmt(recortable[1])} (${Math.round(recortable[1]/gas*100)}% de tus gastos). Bajarlo un 10% te ahorra <b>${fmt(recortable[1]*.1)}</b> por mes.`);
  // comparar con promedio de los 3 meses anteriores

  if(prev.length){let peor=null;
    for(const [c,v] of cats){const avg=prev.reduce((s,a)=>s+a.filter(i=>i.clase==="gasto"&&i.categoria===c).reduce((x,i)=>x+(+i.monto||0),0),0)/prev.length;
      if(avg>0&&v>avg*1.2&&(!peor||v-avg>peor[2]))peor=[c,Math.round((v/avg-1)*100),v-avg]}
    if(peor)out.push(`En <b style="font-family:var(--f-body);font-weight:700">${esc(peor[0])}</b> gastaste ${peor[1]}% más que tu promedio de los meses anteriores.`);}
  const chicos=mes.filter(i=>i.clase==="gasto"&&+i.monto<30000);
  if(chicos.length>=4)out.push(`Tus gastos chicos (menos de Gs. 30.000) suman <b>${fmt(chicos.reduce((s,i)=>s+(+i.monto||0),0))}</b> en ${chicos.length} compras. Son los más fáciles de recortar.`);
  let pendMes=0,porCobrar=0;
  if(ym===ymOf(today())){const fin=`${ym}-31`;const p=pagosPend().filter(i=>!i.fecha||i.fecha<=fin);
    const fx=fijosDe(ym).filter(x=>!fijoListo(x));
    pendMes=p.reduce((a,i)=>a+(+i.monto||0),0)+fx.reduce((a,x)=>a+(+x.f.monto||0),0)+minimosPendMes();
    porCobrar=cobros.filter(c=>!c.mov&&!c.saltado).reduce((a,c)=>a+c.monto,0);
    if(pendMes>0||porCobrar>0){const fin2=saldo+porCobrar-pendMes;
      out.push(`${pendMes>0?`Te falta pagar <b>${fmt(pendMes)}</b> este mes${fx.length?" (cuentas fijas y pendientes)":""}`:"No te queda nada por pagar este mes"}${porCobrar>0?` y todavía vas a cobrar <b>${fmt(porCobrar)}</b>`:""}. Así, el mes cerraría en <b class="${fin2<0?"neg":"pos"}">${fmt(fin2)}</b>.`);}}
  if(ym===ymOf(today())&&(ing>0||plan)){const d=new Date();const dias=new Date(d.getFullYear(),d.getMonth()+1,0).getDate()-d.getDate()+1;const meta=plan?plan.A:ing*pct/100;const disp=ing+porCobrar-gas-pendMes-meta;
    out.push(disp>0?`Contando lo que falta cobrar y pagar, para cumplir la meta de ahorro podés gastar hasta <b>${fmt(Math.floor(disp/dias/1000)*1000)}</b> por día en los ${dias} día${dias===1?"":"s"} que quedan del mes.`:`Para cumplir la meta no te queda margen de gasto este mes.`);}
  return out;
}

/* ---------- precios de productos ---------- */
function historial(){
  const map={};
  items.filter(i=>i.tipo==="mov"&&Array.isArray(i.productos)).forEach(m=>m.productos.forEach(p=>{
    const nom=(p.nombre||"").trim();if(!nom||!+p.precio)return;const k=norm(nom);
    (map[k]=map[k]||{k,nombre:nom,compras:[]}).compras.push({fecha:m.fecha,precio:+p.precio,cant:+p.cant||1,tienda:m.texto,movId:m.id,creado:m.creado||0});
  }));
  Object.values(map).forEach(v=>{v.compras.sort((a,b)=>a.fecha.localeCompare(b.fecha)||a.creado-b.creado);});
  return map;
}
const pctTxt=x=>(x>0?"+":"")+(Math.round(x*1000)/10).toString().replace(".",",")+"%";
function cambioEnMes(h,ym){
  // compara la última compra del mes con la última compra anterior al mes
  const del=h.compras.filter(c=>ymOf(c.fecha)===ym);const antes=h.compras.filter(c=>c.fecha<`${ym}-01`);
  if(!del.length||!antes.length)return null;const a=antes[antes.length-1],b=del[del.length-1];
  return {nombre:h.nombre,antes:a.precio,ahora:b.precio,fechaAntes:a.fecha,d:(b.precio-a.precio)/a.precio};
}
function preciosHtml(){
  const map=historial();let prods=Object.values(map);

  if(!prods.length)return h+`<div class="empty">Cuando anotes una compra con <b>Compra</b> y pongas cada producto con su precio, acá vas a ver cómo cambian los precios mes a mes.</div>`;
  const ym=ymOf(today());const camb=prods.map(p=>cambioEnMes(p,ym)).filter(Boolean);const sub=camb.filter(c=>c.d>0),baj=camb.filter(c=>c.d<0);

  if(precioQ.trim()){const q=norm(precioQ.trim());prods=prods.filter(p=>p.k.includes(q))}
  prods.sort((a,b)=>b.compras[b.compras.length-1].fecha.localeCompare(a.compras[a.compras.length-1].fecha)||a.nombre.localeCompare(b.nombre));
  if(!prods.length)return h+`<div class="empty">No encontré “${esc(precioQ)}”.</div>`;
  return h+`<div class="list">${prods.map(p=>{const c=p.compras;const u=c[c.length-1];const pr=c.length>1?c[c.length-2]:null;const d=pr?(u.precio-pr.precio)/pr.precio:null;
    const hist=c.slice(-4).map(x=>sinGs(x.precio)).join(" → ");
    return `<div class="item"><div style="flex:1;min-width:0"><span class="txt" style="font-weight:600">${esc(p.nombre)}</span><div class="meta"><span>${esc(niceDate(u.fecha))}${u.tienda?` · ${esc(u.tienda)}`:""}</span>${d!==null&&d!==0?`<span class="${d>0?"late":"pos"}" style="font-weight:700">${d>0?"▲":"▼"} ${pctTxt(d)}</span><span>antes ${esc(sinGs(pr.precio))} (${esc(niceDate(pr.fecha).toLowerCase())})</span>`:d===0?`<span>mismo precio que antes</span>`:`<span>1 compra registrada</span>`}</div>${c.length>2?`<div class="meta"><span style="font-family:var(--f-mono)">${esc(hist)}</span></div>`:""}</div><span class="amt">${esc(sinGs(u.precio))}</span></div>`}).join("")}</div><p class="hint">Precio por unidad. Se compara la última compra con la anterior.</p>`;

  const L=[];const T=[`Resumen de ${nombre}${esActual?" (hasta hoy)":""}`];

  if(gasPrev>0&&gas>0){const d=(gas-gasPrev)/gasPrev;const t=`Gastaste ${Math.abs(Math.round(d*100))}% ${d>=0?"más":"menos"} que en ${prevN} (${fmt(gasPrev)})${esActual?", y el mes todavía no terminó":""}.`;L.push(t.replace(/(\d+% (?:más|menos))/,"<b>$1</b>"));T.push(t)}
  // por categoría

  const otrosFijos=mes.filter(i=>i.fijoId&&!/\(cuota \d+ de \d+\)/.test(i.texto||""));
  if(cuotas.length){const t=`Cuotas pagadas: ${cuotas.map(c=>c.texto.replace(/\s*\(cuota (\d+) de (\d+)\)/,": $1 de $2")).join("; ")}.`;L.push(esc(t));T.push(t)}

function openCompra(it,preset={}){
  const tieneProd=it&&Array.isArray(it.productos)&&it.productos.length;
  let prods=tieneProd?it.productos.map(p=>({nombre:p.nombre,cant:+p.cant||1,precio:+p.precio||0})):[{nombre:"",cant:1,precio:0},{nombre:"",cant:1,precio:0},{nombre:"",cant:1,precio:0}];
  const map=historial();const totIni=preset.monto||(it?+it.monto:0);
  let close;
  close=sheet(it?"Editar compra":"Nueva compra",`<div class="seg2" role="group" aria-label="Partes de la compra" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:14px"><span class="ind" aria-hidden="true" style="width:calc((100% - 8px - 4px)/2)"></span><button type="button" data-tab2="a" aria-pressed="true">Compra</button><button type="button" data-tab2="b" aria-pressed="false" id="cTabB">Productos y precios</button></div>
    <div id="cA">
      <div class="field"><label for="cTot">Total que pagaste</label><input id="cTot" data-monto inputmode="numeric" placeholder="28.000" value="${totIni?esc(sinGs(totIni)):""}" style="font-family:var(--f-mono);font-size:1.3rem"></div>
      <div class="row2"><div class="field"><label for="cTienda">Dónde</label><input id="cTienda" value="${esc(preset.texto||(it?it.texto:"Supermercado"))}"></div>
      <div class="field"><label for="cFecha2">Fecha</label><input id="cFecha2" type="date" value="${esc(preset.fecha||(it?it.fecha:today()))}"></div></div>
      <div class="field"><label for="cCat">Categoría</label><select id="cCat">${CAT_LIST.gasto.map(x=>`<option ${x===(preset.categoria||(it?it.categoria:"Comida"))?"selected":""}>${esc(x)}</option>`).join("")}</select></div>
      <p class="hint">Este total es lo que se descuenta de tu caja. Los productos son opcionales: sirven para seguir los precios.</p>
      <button type="button" class="btn ghost" id="cGoB" style="width:100%">Anotar productos y precios →</button>
    </div>
    <div id="cB" hidden>
      <datalist id="prodList">${Object.values(map).map(p=>`<option value="${esc(p.nombre)}"></option>`).join("")}</datalist>
      <div style="display:grid;grid-template-columns:1fr 54px 104px;gap:6px;font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px"><span>Producto</span><span>Cant.</span><span>Precio c/u</span></div>
      <div id="cRows"></div>
      <button type="button" class="btn ghost small" id="cAdd" style="margin:4px 0 12px">+ Otro producto</button>
      <div class="card" style="margin:0 0 6px;background:var(--bg);display:flex;justify-content:space-between;align-items:baseline"><span style="font-weight:700">Suma de productos</span><b id="cTotal" style="font-family:var(--f-mono);font-weight:500;font-size:1.1rem">Gs. 0</b></div>
      <p class="hint" id="cDif" style="margin:0 0 10px"></p>
    </div>`,()=>{
      const ok=prods.filter(p=>p.nombre.trim()&&p.precio>0).map(p=>({nombre:p.nombre.trim().charAt(0).toUpperCase()+p.nombre.trim().slice(1),cant:p.cant>0?p.cant:1,precio:p.precio}));
      const suma=ok.reduce((a,p)=>a+p.precio*p.cant,0);const total=numOf("#cTot")||suma;
      if(!total){toast("Escribí el total que pagaste");tab("a");return false}
      const tienda=$("#cTienda").value.trim()||"Compra";
      const base={...(it||{id:uid(),creado:Date.now()}),tipo:"mov",clase:"gasto",texto:tienda.charAt(0).toUpperCase()+tienda.slice(1),monto:total,categoria:$("#cCat").value,fecha:$("#cFecha2").value||today()};
      if(ok.length)base.productos=ok;else delete base.productos;
      saveItem(base);
      toast(`Compra guardada: ${fmt(total)}${ok.length?` · ${ok.length} producto${ok.length===1?"":"s"} anotado${ok.length===1?"":"s"}`:""}`);
    },it?`<button class="btn ghost" id="cDel">Borrar</button>`:"");
  const tab=k=>{$("#cA").hidden=k!=="a";$("#cB").hidden=k!=="b";document.querySelectorAll("[data-tab2]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tab2===k));
    const sg=document.querySelector("#sheetHost .seg2");const on=sg.querySelector('[aria-pressed="true"]');sg.querySelector(".ind").style.transform=`translateX(${on.offsetLeft-4}px)`;
    if(k==="b"){const f=$("#cRows").querySelector('[data-f="nombre"]');if(f&&!f.value)setTimeout(()=>f.focus(),60)}};
  document.querySelectorAll("[data-tab2]").forEach(b=>b.onclick=()=>tab(b.dataset.tab2));
  $("#cGoB").onclick=()=>tab("b");
  const hintFor=i=>{const p=prods[i];const h=map[norm((p.nombre||"").trim())];if(!h)return p.nombre.trim()?"Producto nuevo":"";
    const prev=h.compras.filter(c=>!it||c.movId!==it.id);if(!prev.length)return "";const u=prev[prev.length-1];
    let s=`Última vez: ${sinGs(u.precio)} (${niceDate(u.fecha).toLowerCase()})`;
    if(p.precio>0&&p.precio!==u.precio){const d=(p.precio-u.precio)/u.precio;s+=` · <span class="${d>0?"neg":"pos"}" style="font-weight:700">${d>0?"▲":"▼"} ${pctTxt(d)}</span>`}else if(p.precio===u.precio)s+=" · mismo precio";
    return s};
  const total=()=>{const suma=prods.reduce((a,p)=>a+(p.precio||0)*(p.cant||1),0);const tot=numOf("#cTot");$("#cTotal").textContent=fmt(suma);
    const n=prods.filter(p=>p.nombre.trim()&&p.precio>0).length;$("#cTabB").textContent=n?`Productos (${n})`:"Productos y precios";
    $("#cDif").innerHTML=!suma?"":!tot?`El total de la compra va a ser ${fmt(suma)}.`:suma===tot?`<span class="pos">✓ Coincide con el total pagado.</span>`:suma<tot?`Te faltan anotar ${fmt(tot-suma)} del total. No hace falta anotar todo.`:`<span class="neg">Los productos suman ${fmt(suma-tot)} más que el total pagado.</span> Revisá los precios o el total.`};
  const rows=()=>{$("#cRows").innerHTML=prods.map((p,i)=>`<div style="margin-bottom:8px"><div style="display:grid;grid-template-columns:1fr 54px 104px;gap:6px">
      <input data-i="${i}" data-f="nombre" list="prodList" value="${esc(p.nombre)}" placeholder="${["Leche","Pan","Queso"][i]||"Producto"}" aria-label="Producto ${i+1}" style="border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;min-width:0">
      <input data-i="${i}" data-f="cant" type="number" min="1" inputmode="decimal" value="${p.cant}" aria-label="Cantidad" style="border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 6px;min-width:0;text-align:center">
      <input data-i="${i}" data-f="precio" inputmode="numeric" value="${p.precio?esc(sinGs(p.precio)):""}" placeholder="5.500" aria-label="Precio" style="border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 8px;min-width:0;font-family:var(--f-mono)"></div>
      <div class="hint" id="cH${i}" style="margin-top:3px">${hintFor(i)}</div></div>`).join("");
    $("#cRows").querySelectorAll("input").forEach(el=>el.addEventListener("input",()=>{const i=+el.dataset.i,f=el.dataset.f;
      if(f==="precio"){const d=el.value.replace(/\D/g,"");el.value=d?d.replace(/\B(?=(\d{3})+(?!\d))/g,"."):"";prods[i].precio=Number(d)||0}
      else if(f==="cant")prods[i].cant=Math.max(0,+el.value||0);else prods[i].nombre=el.value;
      $("#cH"+i).innerHTML=hintFor(i);total()}));total()};
  rows();
  $("#cTot").addEventListener("input",total);
  $("#cAdd").onclick=()=>{prods.push({nombre:"",cant:1,precio:0});rows();const ins=$("#cRows").querySelectorAll('[data-f="nombre"]');ins[ins.length-1].focus()};
  if(it)$("#cDel").onclick=()=>confirmDel("¿Borrar esta compra? Se devuelve el monto a caja.",()=>{deleteItem(it.id);toast("Compra borrada")},close);
  requestAnimationFrame(()=>tab(preset.tab==="prod"?"b":"a"));
  if(!it&&preset.tab!=="prod")setTimeout(()=>$("#cTot").focus(),80);
}
function openMoney(it,preset={}){
  const host=$("#sheetHost");const clase=it?it.clase:(preset.clase||"gasto");
  const catOpts=(c,sel)=>CAT_LIST[c].map(x=>`<option ${x===sel?"selected":""}>${esc(x)}</option>`).join("");
  host.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-label="Movimiento de dinero">
    <h3>${it?"Editar movimiento":clase==="ingreso"?"Nuevo ingreso":"Nuevo gasto"}</h3>
    <div class="seg" role="group" aria-label="Tipo"><button type="button" class="tchip" data-clase="ingreso" aria-pressed="${clase==="ingreso"}">Ingreso</button><button type="button" class="tchip" data-clase="gasto" aria-pressed="${clase==="gasto"}">Gasto</button></div>
    <div class="field"><label for="mMonto">Monto en guaraníes</label><input id="mMonto" inputmode="numeric" placeholder="50.000" value="${it?esc(fmt(it.monto).replace("Gs. ","")):""}" style="font-family:var(--f-mono);font-size:1.2rem"></div>
    <div class="field"><label for="mTexto">Descripción</label><input id="mTexto" value="${esc(it?it.texto:(preset.texto||""))}" placeholder="${clase==="ingreso"?"Sueldo, venta…":"Supermercado, nafta…"}"></div>
    <div class="row2"><div class="field"><label for="mCat">Categoría</label><select id="mCat">${catOpts(clase,it?it.categoria:catFor(norm(preset.texto||""),clase))}</select></div>
    <div class="field"><label for="mFecha">Fecha</label><input id="mFecha" type="date" value="${esc(it?it.fecha:today())}"></div></div>
    <button type="button" class="btn ghost" id="mProd" style="width:100%;margin-bottom:12px" ${clase==="ingreso"?"hidden":""}>Anotar productos y precios →</button>
    <div class="foot">${it?`<button class="btn ghost" id="mDel">Borrar</button>`:"<span></span>"}<div style="display:flex;gap:8px"><button class="btn ghost" id="mCancel">Cancelar</button><button class="btn" id="mSave">Guardar</button></div></div>
    <div id="mConfirm"></div></div></div>`;
  let cl=clase;const close=()=>host.innerHTML="";
  const monto=$("#mMonto");
  monto.addEventListener("input",()=>{const d=monto.value.replace(/\D/g,"");monto.value=d?d.replace(/\B(?=(\d{3})+(?!\d))/g,"."):""});
  if(!it)setTimeout(()=>monto.focus(),60);
  host.querySelectorAll("[data-clase]").forEach(b=>b.onclick=()=>{cl=b.dataset.clase;host.querySelectorAll("[data-clase]").forEach(x=>x.setAttribute("aria-pressed",x===b));$("#mCat").innerHTML=catOpts(cl,catFor(norm($("#mTexto").value),cl));if(!it)host.querySelector("h3").textContent=cl==="ingreso"?"Nuevo ingreso":"Nuevo gasto";$("#mProd").hidden=cl==="ingreso"});
  $("#mProd").onclick=()=>{const pre={monto:Number(monto.value.replace(/\D/g,""))||0,texto:$("#mTexto").value.trim()||"Supermercado",fecha:$("#mFecha").value||today(),categoria:$("#mCat").value,tab:"prod"};close();openCompra(it,pre)};
  $("#mTexto").addEventListener("change",()=>{if(!it)$("#mCat").innerHTML=catOpts(cl,catFor(norm($("#mTexto").value),cl))});
  $("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")close()});
  $("#mCancel").onclick=close;
  $("#mSave").onclick=()=>{
    const v=Number(monto.value.replace(/\D/g,""));if(!v){toast("Escribí el monto");return}
    const txt=$("#mTexto").value.trim()||$("#mCat").value;
    const f=$("#mFecha").value||today();
    saveItem({...(it||{id:uid(),creado:Date.now()}),tipo:"mov",clase:cl,monto:v,texto:txt.charAt(0).toUpperCase()+txt.slice(1),categoria:$("#mCat").value,fecha:f});
    close();toast(`${cl==="ingreso"?"Ingreso":"Gasto"} guardado: ${fmt(v)}`);
  };
  if(it)$("#mDel").onclick=()=>{$("#mConfirm").innerHTML=`<div class="confirm">¿Borrar este movimiento?<div style="margin-top:8px;display:flex;gap:8px"><button class="btn danger small" id="mDelYes">Sí, borrar</button><button class="btn ghost small" id="mDelNo">No</button></div></div>`;
    $("#mDelYes").onclick=()=>{deleteItem(it.id);close();toast("Borrado")};$("#mDelNo").onclick=()=>$("#mConfirm").innerHTML=""};
}

const montoMask=el=>el.addEventListener("input",()=>{const d=el.value.replace(/\D/g,"");el.value=d?d.replace(/\B(?=(\d{3})+(?!\d))/g,"."):""});
const sinGs=v=>fmt(v).replace("Gs. ","");
function openPago(it,preset={}){
  const host=$("#sheetHost");const pagado=it&&it.estado==="hecho";
  host.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-label="Pago pendiente">
    <h3>${it?(pagado?"Pago ya realizado":"Editar pago pendiente"):"Nuevo pago pendiente"}</h3>
    <p class="hint" style="margin:-6px 0 12px">Queda anotado sin descontarse de caja. Se descuenta recién cuando tocás “Pagar”.</p>
    <div class="field"><label for="pTexto">Qué tenés que pagar</label><input id="pTexto" value="${esc(it?it.texto:(preset.texto||""))}" placeholder="Cuota, tarjeta, préstamo…"></div>
    <div class="row2"><div class="field"><label for="pMonto">Monto</label><input id="pMonto" inputmode="numeric" placeholder="500.000" value="${it?esc(sinGs(it.monto)):(preset.monto?esc(sinGs(preset.monto)):"")}" style="font-family:var(--f-mono)"></div>
    <div class="field"><label for="pFecha">Vence</label><input id="pFecha" type="date" value="${esc(it?(it.fecha||""):(preset.fecha||""))}"></div></div>
    <div class="row2"><div class="field"><label for="pCat">Categoría</label><select id="pCat">${CAT_LIST.gasto.map(x=>`<option ${x===(it?it.categoria:catFor(norm(preset.texto||""),"gasto"))?"selected":""}>${esc(x)}</option>`).join("")}</select></div>
    <div class="field"><label for="pRep">Se repite</label><select id="pRep">${Object.entries(REP).map(([k,v])=>`<option value="${k}" ${k===((it&&it.repetir)||"no")?"selected":""}>${v}</option>`).join("")}</select></div></div>
    <div class="foot">${it?`<button class="btn ghost" id="pDel">Borrar</button>`:"<span></span>"}<div style="display:flex;gap:8px"><button class="btn ghost" id="pCancel">Cancelar</button><button class="btn" id="pSave">Guardar</button></div></div>
    <div id="pConfirm"></div></div></div>`;
  const close=()=>host.innerHTML="";montoMask($("#pMonto"));
  if(!it)setTimeout(()=>$("#pTexto").value?$("#pMonto").focus():$("#pTexto").focus(),60);
  $("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")close()});
  $("#pCancel").onclick=close;
  $("#pSave").onclick=()=>{
    const v=Number($("#pMonto").value.replace(/\D/g,""));const txt=$("#pTexto").value.trim();
    if(!txt){toast("Escribí qué tenés que pagar");return}if(!v){toast("Escribí el monto");return}
    saveItem({...(it||{id:uid(),creado:Date.now(),estado:"pendiente"}),tipo:"pago",texto:txt.charAt(0).toUpperCase()+txt.slice(1),monto:v,fecha:$("#pFecha").value||null,hora:null,categoria:$("#pCat").value,repetir:$("#pRep").value,prioridad:"normal"});
    close();toast("Guardado en Por pagar. No se descontó de caja.");
  };
  if(it)$("#pDel").onclick=()=>{$("#pConfirm").innerHTML=`<div class="confirm">¿Borrar este pago pendiente? No cambia tu caja.<div style="margin-top:8px;display:flex;gap:8px"><button class="btn danger small" id="pDelYes">Sí, borrar</button><button class="btn ghost small" id="pDelNo">No</button></div></div>`;
    $("#pDelYes").onclick=()=>{deleteItem(it.id);close();toast("Borrado")};$("#pDelNo").onclick=()=>$("#pConfirm").innerHTML=""};
}
function openPagar(it){
  const host=$("#sheetHost");
  host.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-label="Registrar pago">
    <h3>Pagar: ${esc(it.texto)}</h3>
    <p class="hint" style="margin:-6px 0 12px">Se registra como gasto y se descuenta de caja.${it.repetir&&it.repetir!=="no"?` Como se repite, queda pendiente el próximo para ${esc(niceDate(addInterval(it.fecha||today(),it.repetir)).toLowerCase())}.`:""}</p>
    <div class="row2"><div class="field"><label for="qMonto">Monto pagado</label><input id="qMonto" inputmode="numeric" value="${esc(sinGs(+it.monto||0))}" style="font-family:var(--f-mono);font-size:1.15rem"></div>
    <div class="field"><label for="qFecha">Fecha de pago</label><input id="qFecha" type="date" value="${today()}"></div></div>
    <div class="foot"><span></span><div style="display:flex;gap:8px"><button class="btn ghost" id="qCancel">Cancelar</button><button class="btn out" id="qOk">Pagar y descontar</button></div></div></div></div>`;
  const close=()=>host.innerHTML="";montoMask($("#qMonto"));
  $("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")close()});
  $("#qCancel").onclick=close;
  $("#qOk").onclick=async()=>{
    const v=Number($("#qMonto").value.replace(/\D/g,""));if(!v){toast("Escribí el monto pagado");return}
    const f=$("#qFecha").value||today();close();
    await saveItem({id:uid(),tipo:"mov",clase:"gasto",monto:v,texto:it.texto,categoria:it.categoria||"Otros gastos",fecha:f,creado:Date.now(),pagoDe:it.id,...(it.ejemplo?{ejemplo:true}:{})});
    if(it.repetir&&it.repetir!=="no")await saveItem({...it,fecha:addInterval(it.fecha||f,it.repetir),top3:null});
    else await saveItem({...it,estado:"hecho",hechoEl:today(),pagadoEl:f,top3:null});
    toast(`Pagado: se descontaron ${fmt(v)} de caja`);
  };
}

/* ---------- plan del mes: sueldo, fijos, presupuesto ---------- */
function planHtml(ym,mes,parts=["sueldo","fijos","presupuesto","metas"]){
  const t=today();const s=sueldoCfg();let h="";
  // sueldo
  if(parts.includes("sueldo")){
  h+=`<section class="block"><div class="sh"><h2>Sueldo</h2><button class="btn ghost small" data-act="cfgSueldo">${s?"Editar":"Configurar"}</button></div>`;
  if(!s)h+=`<div class="empty">Cargá tu sueldo y los días que cobrás (por ejemplo el 10 y el 25). Brújula arma tu plan del mes y te avisa cuándo registrar cada cobro.</div>`;
  else h+=`<div class="list">${cobrosDe(ym).map(c=>{const dd=Math.round((fromIso(c.fecha)-fromIso(t))/864e5);
    const est=c.mov?`<span class="tag pos">Cobrado ${esc(sinGs(+c.mov.monto))}</span>`:c.saltado?`<span class="tag">Marcado como cobrado</span>`:dd>0?`<span>Faltan ${dd} día${dd===1?"":"s"}</span>`:`<span class="late">${dd===0?"Es hoy":"Ya pasó la fecha"}</span>`;
    const btn=!c.mov&&!c.saltado&&dd<=0?`<div class="acts"><button class="btn in small" data-act="cobrar" data-key="${c.key}">Ya cobré</button><button class="btn ghost small" data-act="saltarCobro" data-key="${c.key}">Ya lo tenía anotado</button></div>`:"";
    return `<div class="item"><span class="mico in" aria-hidden="true">+</span><div style="flex:1;min-width:0"><span class="txt">Cobro del ${+c.key.slice(8)}</span><div class="meta">${est}</div>${btn}</div><span class="amt pos">${esc(sinGs(c.monto))}</span></div>`}).join("")}</div>`;
  h+=`</section>`;}
  // cuentas fijas
  if(parts.includes("fijos")){
  const fx=fijosDe(ym);const totF=fx.reduce((a,x)=>a+(+x.f.monto||0),0);const pagF=fx.filter(fijoListo).length;
  h+=`<section class="block"><div class="sh"><h2>Cuentas fijas</h2><button class="btn ghost small" data-act="nuevoFijo">+ Agregar</button></div>`;
  if(!fx.length)h+=`<div class="empty">Agregá lo que pagás todos los meses: internet, agua, luz, tarjeta, cuotas. Cada mes te aparecen para marcar como pagadas.</div>`;
  else{const conCuotas=fijos().map(f=>[f,cuotaInfo(f)]).filter(([,c])=>c&&c.restantes>0);const deudaT=conCuotas.reduce((a,[,c])=>a+c.deuda,0);
    const terminados=fijos().filter(fijoTerminado);
    h+=`<p class="caja" style="margin-bottom:8px">Total por mes: <b>${fmt(totF)}</b> · ${pagF} de ${fx.length} pagada${fx.length===1?"":"s"}${deudaT?`<br>Te falta pagar en cuotas: <b>${fmt(deudaT)}</b>`:""}${terminados.length?`<br>Terminaste de pagar: ${terminados.map(f=>esc(f.texto)).join(", ")} 🎉`:""}</p><div class="list">${fx.map(x=>{const ci=cuotaInfo(x.f);const dd=Math.round((fromIso(x.fecha)-fromIso(t))/864e5);const listo=fijoListo(x);
    const est=x.mov?`<span class="tag pos">Pagado ${esc(niceDate(x.mov.fecha).toLowerCase())}</span>`:x.saltado?`<span class="tag">Marcado como pagado</span>`:dd<0?`<span class="late">Venció el ${+x.fecha.slice(8)}</span>`:dd===0?`<span class="late">Vence hoy</span>`:`<span>Vence el ${+x.fecha.slice(8)} · faltan ${dd} día${dd===1?"":"s"}</span>`;

/* ---------- metas ---------- */
const metas=()=>items.filter(i=>i.tipo==="meta").sort((a,b)=>(a.creado||0)-(b.creado||0));
const ahorradoDe=m=>(+m.inicial||0)+(m.aportes||[]).reduce((a,x)=>a+(+x.monto||0),0);
const aportadoDe=m=>(m.aportes||[]).reduce((a,x)=>a+(+x.monto||0),0);
const aportadoTotal=()=>metas().reduce((a,m)=>a+aportadoDe(m),0);
const ahorradoTotal=()=>metas().reduce((a,m)=>a+ahorradoDe(m),0);
const aportesMes=ym=>metas().reduce((a,m)=>a+(m.aportes||[]).filter(x=>ymOf(x.fecha||"")===ym).reduce((b,x)=>b+(+x.monto||0),0),0);
function cajaTotal(){const all=items.filter(i=>i.tipo==="mov");return suma(all,"ingreso")-suma(all,"gasto")-aportadoTotal()}
function proyeccion(m){
  const tiene=ahorradoDe(m);const falta=Math.max(0,(+m.objetivo||0)-tiene);const ap=+m.aporte||0;const cur=ymOf(today());
  const r={tiene,falta,pct:m.objetivo?Math.min(100,tiene/m.objetivo*100):0};
  if(falta<=0){r.listo=true;return r}
  if(ap>0){r.meses=Math.ceil(falta/ap);r.llega=ymAdd(cur,r.meses)}
  if(m.limite){const [y,mo]=m.limite.split("-").map(Number);const [cy,cm]=cur.split("-").map(Number);const n=Math.max(1,(y-cy)*12+(mo-cm));r.necesita=Math.ceil(falta/n/1000)*1000;r.mesesLim=n;r.llegaATiempo=ap>0&&r.necesita<=ap}
  return r;
}
function metasHtml(){
  const ms=metas();const plan=planMes();let h=`<section class="block"><div class="sh"><h2>Metas</h2><button class="btn ghost small" data-act="nuevaMeta">+ Nueva meta</button></div>`;
  if(!ms.length)return h+`<div class="empty">Poné algo que querés comprar o juntar, por ejemplo “heladera, Gs. 3.500.000, ahorro 300.000 por mes”, y Brújula te dice en cuántos meses llegás.</div></section>`;
  const totAp=ms.filter(m=>!proyeccion(m).listo).reduce((a,m)=>a+(+m.aporte||0),0);
  if(plan&&totAp>plan.A)h+=`<p class="hint" style="margin:-2px 0 10px;color:var(--warn)">Tus metas piden ${fmt(totAp)} por mes y tu ahorro planeado es ${fmt(plan.A)}. Subí el % de ahorro o estirá alguna meta.</p>`;
  h+=`<div class="tips" style="gap:10px">`;
  ms.forEach(m=>{const p=proyeccion(m);
    let linea="";
    if(p.listo)linea=`<span class="pos" style="font-weight:700">¡Meta cumplida!</span>`;
    else{
      if(p.meses)linea+=`Ahorrando ${fmt(+m.aporte)} por mes llegás en <b>${p.meses} mes${p.meses===1?"":"es"}</b> (${esc(ymName(p.llega).toLowerCase())}).`;
      else linea+=`Poné cuánto vas a ahorrar por mes para calcular cuándo llegás.`;
      if(m.limite)linea+=` Para llegar a ${esc(ymName(ymOf(m.limite)).toLowerCase())} necesitás <b>${fmt(p.necesita)}</b> por mes${p.meses?(p.llegaATiempo?`<span class="pos">: vas bien.</span>`:`<span class="neg">: con tu aporte actual no llegás a tiempo.</span>`):"."}`;
    }
    h+=`<div class="card" style="margin:0"><div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline"><button class="body" data-act="edit" data-id="${m.id}" style="background:none;border:0;padding:0;text-align:left;font-family:var(--f-display);font-weight:700;font-size:1.05rem">${esc(m.texto)}</button><span style="font-family:var(--f-mono);font-size:.85rem;color:var(--muted);white-space:nowrap">${Math.round(p.pct)}%</span></div>
      <div class="trk" style="height:10px;border-radius:5px;background:var(--sunk);margin:8px 0 6px;overflow:hidden"><div style="height:100%;width:${p.pct}%;background:${p.listo?"var(--ok)":"var(--sun)"};border-radius:5px"></div></div>
      <div style="display:flex;justify-content:space-between;gap:8px;font-size:.85rem;flex-wrap:wrap"><span>Tenés <b style="font-family:var(--f-mono);font-weight:500">${fmt(p.tiene)}</b></span><span style="color:var(--muted)">de ${fmt(+m.objetivo||0)}${p.falta>0?` · faltan ${fmt(p.falta)}`:""}</span></div>
      <p style="margin:8px 0 10px;font-size:.9rem;color:var(--ink)">${linea}</p>${m.ejemplo?`<span class="tag" style="font-size:.75rem">Ejemplo</span> `:""}
      ${p.listo?`<div class="btns"><button class="btn ghost small" data-act="retirarMeta" data-id="${m.id}">Sacar plata</button></div>`:`<div class="btns"><button class="btn small" data-act="aportar" data-id="${m.id}">+ Guardar plata</button>${ahorradoDe(m)>0?`<button class="btn ghost small" data-act="retirarMeta" data-id="${m.id}">Sacar</button>`:""}<button class="btn ghost small" data-act="edit" data-id="${m.id}">Editar</button></div>`}</div>`});
  return h+`</div></section>`;
}

/* ---------- tarjetas de crédito ---------- */
const tarjetas=()=>items.filter(i=>i.tipo==="tarjeta").sort((a,b)=>(a.creado||0)-(b.creado||0));
const pagosTarjeta=t=>items.filter(i=>i.tipo==="mov"&&i.tarjetaId===t.id);
function deudaTarjeta(t){return (+t.saldoInicial||0)+(t.consumos||[]).reduce((a,c)=>a+(+c.monto||0),0)-pagosTarjeta(t).reduce((a,m)=>a+(+m.monto||0),0)}
function tarjetaMes(t,ym){
  const deuda=deudaTarjeta(t);const pagado=pagosTarjeta(t).filter(m=>ymOf(m.fecha)===ym).reduce((a,m)=>a+(+m.monto||0),0);
  const min=Math.min(+t.minimo||0,Math.max(0,deuda+pagado));const falta=Math.max(0,min-pagado);
  return {deuda,pagado,minimo:min,falta,vence:t.diaVence?diaEnMes(ym,+t.diaVence):null};
}
const consumosDe=ym=>tarjetas().flatMap(t=>(t.consumos||[]).filter(c=>ymOf(c.fecha)===ym).map(c=>({...c,tarjeta:t})));
const minimosPendMes=()=>{const ym=ymOf(today());return tarjetas().reduce((a,t)=>a+tarjetaMes(t,ym).falta,0)};
function proyTarjeta(deuda,pago,interes){
  const i=(+interes||0)/100;if(deuda<=0)return {meses:0};if(!(pago>0))return null;
  if(i>0&&pago<=deuda*i)return {nunca:true};
  let d=deuda,n=0,tot=0;while(d>0&&n<600){d=d*(1+i);const p=Math.min(pago,d);d-=p;tot+=p;n++}
  return {meses:n,total:tot,intereses:Math.max(0,tot-deuda)};
}
function tarjetasHtml(){
  const ts=tarjetas();const ym=ymOf(today());const t0=today();
  let h=`<section class="block"><div class="sh"><h2>Tarjetas de crédito</h2><button class="btn ghost small" data-act="nuevaTarjeta">+ Agregar</button></div>`;
  if(!ts.length)return h+`<div class="empty">Cargá tu tarjeta con lo que debés hoy. Cada compra con la tarjeta sube la deuda (sin tocar tu caja) y cada pago la baja.</div></section>`;
  ts.forEach(t=>{const m=tarjetaMes(t,ym);const lim=+t.limite||0;const uso=lim?Math.min(100,Math.max(0,m.deuda/lim*100)):0;
    const dd=m.vence?Math.round((fromIso(m.vence)-fromIso(t0))/864e5):null;
    const venceTxt=m.vence?(m.falta<=0?`Mínimo del mes pagado ✓`:dd<0?`Mínimo vencido el ${+m.vence.slice(8)}`:dd===0?`Mínimo vence hoy`:`Vence el ${+m.vence.slice(8)} · en ${dd} día${dd===1?"":"s"}`):"";
    const pr=proyTarjeta(m.deuda,+t.minimo||0,t.interes);
    let info="";
    if(m.deuda<=0)info=`¡No debés nada en esta tarjeta!`;
    else if(pr&&pr.nunca)info=`Con el mínimo de ${fmt(+t.minimo)} <b class="neg">no alcanzás a cubrir el interés</b>: la deuda no baja. Pagá más que el mínimo.`;
    else if(pr)info=`Pagando ${fmt(+t.minimo)} por mes terminás en <b>${pr.meses} mes${pr.meses===1?"":"es"}</b> (${esc(ymName(ymAdd(ym,pr.meses)).toLowerCase())})${pr.intereses>0?`, y pagarías <b class="neg">${fmt(Math.round(pr.intereses/1000)*1000)}</b> de intereses`:""}.`;
    const pr2=t.interes&&m.deuda>0?proyTarjeta(m.deuda,Math.max(+t.minimo||0,Math.ceil(m.deuda/12/1000)*1000),t.interes):null;
    if(pr2&&!pr2.nunca&&pr&&!pr.nunca&&pr2.meses<pr.meses)info+=` Si pagás ${fmt(Math.max(+t.minimo||0,Math.ceil(m.deuda/12/1000)*1000))}, terminás en ${pr2.meses} meses y ahorrás ${fmt(Math.round((pr.intereses-pr2.intereses)/1000)*1000)}.`;
    const cmes=(t.consumos||[]).filter(c=>ymOf(c.fecha)===ym);const cm=cmes.reduce((a,c)=>a+(+c.monto||0),0);
    h+=`<div style="margin-bottom:14px"><div class="ccard">
      <div class="row1"><button class="nm" data-act="edit" data-id="${t.id}">${esc(t.texto)}</button><span class="chip" aria-hidden="true"></span></div>
      <div class="lbl">Deuda actual</div><div class="debt" data-count="${m.deuda}">${fmt(m.deuda)}</div>
      ${lim?`<div class="use" aria-label="Usaste el ${Math.round(uso)}% del límite"><i style="width:${uso}%"></i></div><div class="meta2"><span>Disponible ${fmt(Math.max(0,lim-m.deuda))}</span><span>Límite ${fmt(lim)}</span></div>`:""}
      <div class="meta2"><span>${m.minimo?`Mínimo ${fmt(m.minimo)}`:"Sin mínimo cargado"}${m.pagado?` · pagaste ${fmt(m.pagado)}`:""}</span><span>${esc(venceTxt)}</span></div>
      <div class="acts"><button class="btn small" data-act="pagarTarjeta" data-id="${t.id}">Pagar</button><button class="btn ghost small" data-act="compraTarjeta" data-id="${t.id}">+ Compra</button></div>
    </div>
    <p class="ccinfo">${info}${cm?` Este mes compraste <b>${fmt(cm)}</b> con esta tarjeta.`:""}</p>`;
    const hist=[...(t.consumos||[]).map(c=>({f:c.fecha,txt:c.texto,m:+c.monto,cargo:c.cargo,c})),...pagosTarjeta(t).map(p=>({f:p.fecha,txt:"Pago",m:-p.monto,p}))].sort((a,b)=>b.f.localeCompare(a.f)).slice(0,4);
    if(hist.length)h+=`<div class="list" style="margin-top:8px">${hist.map(x=>`<button class="mrow" ${x.c?`data-act="editConsumo" data-t="${t.id}" data-c="${x.c.id}"`:`data-act="edit" data-id="${x.p.id}"`}><span class="ic ${x.m<0?"g":x.cargo?"y":"r"}" style="width:32px;height:32px">${x.m<0?ICO.down:ICO.up}</span><span class="tx"><b style="font-size:.9rem">${esc(x.txt)}${x.cargo?" (cargo)":""}</b><span>${esc(niceDate(x.f))}${x.m<0?" · salió de caja":" · no salió de caja"}</span></span><span class="amt ${x.m<0?"pos":""}">${x.m<0?"−":"+"}${esc(sinGs(Math.abs(x.m)))}</span></button>`).join("")}</div>`;
    h+=`</div>`;
  });
  return h+`</section>`;
}

const CATS_VAR=["Comida","Transporte","Salidas y ocio","Ropa y personal","Salud","Educación","Otros gastos"];
function gastoVar(ym,desde,hasta){
  const out={};const add=(c,m,txt,f)=>{if(!CATS_VAR.includes(c))return;const o=out[c]=out[c]||{monto:0,n:0,items:[]};o.monto+=m;o.n++;o.items.push({txt,m,f})};
  items.filter(i=>i.tipo==="mov"&&i.clase==="gasto"&&!i.fijoId&&!i.tarjetaId&&!i.pagoDe&&(ym?ymOf(i.fecha)===ym:(i.fecha>=desde&&i.fecha<hasta))).forEach(i=>add(i.categoria,+i.monto||0,i.texto,i.fecha));
  tarjetas().forEach(t=>(t.consumos||[]).filter(c=>!c.cargo&&(ym?ymOf(c.fecha)===ym:(c.fecha>=desde&&c.fecha<hasta))).forEach(c=>add(c.categoria,+c.monto||0,c.texto,c.fecha)));
  return out;
}
function consejosCat(cat,g,ym,semanal){
  const T=[];const its=g.items;
  const chicos=its.filter(x=>x.m<30000);
  if(cat==="Comida"){
    const deliv=its.filter(x=>/delivery|pedido|pedidosya|monchis|hamburg|pizza|lomito/i.test(x.txt));
    if(deliv.length>=2){const sd=deliv.reduce((a,x)=>a+x.m,0);T.push(`Pediste comida ${deliv.length} veces (${fmt(sd)}). Cambiar la mitad por comida hecha en casa te ahorra unos ${fmt(Math.round(sd/2/1000)*1000)}.`)}
    const sup=its.filter(x=>/super|despensa|mercado|compra/i.test(x.txt));
    if(sup.length>=4)T.push(`Fuiste al súper ${sup.length} veces este mes. Cada visita extra suma cosas que no ibas a comprar: hacé una compra grande el día de cobro con lista cerrada y después solo pan, frutas y verduras.`);
    else T.push(`Hacé la compra grande el día de cobro con una lista cerrada, y entre cobros solo lo fresco (pan, frutas, verduras).`);
    const camb=Object.values(historial()).map(p=>cambioEnMes(p,ym)).filter(c=>c&&c.d>0.04).sort((a,b)=>b.d-a.d).slice(0,2);
    if(camb.length)T.push(`Subieron ${camb.map(c=>`${c.nombre} (${pctTxt(c.d)})`).join(" y ")}: compará en otro súper o probá la marca propia del súper.`);
    else T.push(`Probá las marcas propias del súper en arroz, fideos, aceite y lácteos: suelen salir más baratas por la misma cantidad.`);
    T.push(`Planificá los almuerzos de la semana y cociná doble: comprás solo lo que vas a usar y se tira menos comida.`);
  }else if(cat==="Salidas y ocio"){T.push(`Ponete un tope por semana para salidas ${semanal?`(con tu tope serían unos ${fmt(semanal)})`:""} y cuando se termina, se termina hasta la otra semana.`);T.push(`Alterná: una salida afuera, una juntada en casa.`)}
  else if(cat==="Transporte"){T.push(`Juntá los mandados en un solo viaje en vez de varios cortos.`);T.push(`Mantené las cubiertas bien infladas y el auto con el service al día: gasta menos combustible.`)}
  else if(cat==="Ropa y personal"){T.push(`Antes de comprar ropa o cosas personales, esperá 48 horas. Si después de dos días todavía lo querés, compralo.`)}
  else if(cat==="Salud"){T.push(`En remedios que tomás seguido, preguntá en la farmacia por la versión genérica.`)}
  else if(cat==="Otros gastos"){T.push(`Revisá suscripciones y servicios que pagás y no usás.`)}
  if(chicos.length>=4&&cat!=="Salud")T.push(`${chicos.length} gastos chicos suman ${fmt(chicos.reduce((a,x)=>a+x.m,0))}. Son los más fáciles de cortar: kiosco, gaseosas, antojos.`);
  return T.slice(0,3);
}
function alertasGasto(ym){
  const g=gastoVar(ym);const cur=ym===ymOf(today());const d=new Date();
  const dim=new Date(+ym.slice(0,4),+ym.slice(5),0).getDate();
  const avance=cur?Math.max(.35,d.getDate()/dim):1;
  const plan=planMes();const lim=plan?Object.fromEntries(plan.cats):{};
  const prev=[1,2,3].map(k=>gastoVar(ymAdd(ym,-k))).filter(o=>Object.keys(o).length);
  const out=[];
  for(const [cat,o] of Object.entries(g)){
    let ref=null,refTxt="",full=0;
    if(lim[cat]>0){full=lim[cat];ref=lim[cat]*avance;refTxt=cur?`tu tope a esta altura del mes`:`tu tope del mes`}
    else if(prev.length){const avg=prev.reduce((a,x)=>a+((x[cat]||{}).monto||0),0)/prev.length;if(avg>0){full=avg;ref=avg*avance;refTxt=cur?`tu promedio a esta altura del mes`:`tu promedio de meses anteriores`}}
    if(!ref)continue;
    const exc=o.monto-ref;
    if(o.monto>ref*1.15&&exc>=50000)out.push({cat,monto:o.monto,ref,refTxt,pct:o.monto/ref-1,exc,tips:consejosCat(cat,o,ym,full?Math.round(full/4.3/1000)*1000:0),tope:lim[cat]||null});
  }
  return out.sort((a,b)=>b.exc-a.exc);
}

function periodoCobro(){
  const s=sueldoCfg();if(!s)return null;
  const dias=(s.dias&&s.dias.length?s.dias:[1]).map(Number).sort((a,b)=>a-b);const t=today();const ym=ymOf(t);
  const fechas=[];[-1,0,1].forEach(k=>{const m=ymAdd(ym,k);dias.forEach(d=>fechas.push(diaEnMes(m,d)))});fechas.sort();
  let i=fechas.filter(f=>f<=t).length-1;const ini=fechas[i],fin=fechas[i+1];

}
